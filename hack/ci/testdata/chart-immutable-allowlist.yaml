# Allowlist for hack/ci/check-chart-immutable-fields.
#
# The checker fails a PR when a chart change touches a field that
# `helm upgrade` cannot change in place (for example a StatefulSet selector)
# or removes an object that holds data (StatefulSet, PersistentVolumeClaim).
# Such a change is only fine when existing installations are migrated, for
# example by deleting the old object in the installer before the upgrade.
#
# Each entry needs all four fields:
#
#   - object: StatefulSet/mla/cortex-ingester  # Kind/namespace/name, or Kind/name without namespace
#     field: spec.selector                     # as printed by the checker, "removed" for deleted objects
#     reason: why the change is needed
#     migration: pkg/install/stack/usercluster-mla/stack.go:123  # code that migrates existing installations
#
# An entry without migration is an error.

[]
