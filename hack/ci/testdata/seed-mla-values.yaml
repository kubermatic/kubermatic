# Helm values for the seed-mla stack in the seed MLA e2e job: small volumes,
# and the user cluster MLA rules turned on, because the job also runs the
# usercluster-mla stack.

prometheus:
  storageSize: 1Gi
  ruleFiles:
    - /etc/prometheus/rules/general-*.yaml
    - /etc/prometheus/rules/kubermatic-seed-*.yaml
    - /etc/prometheus/rules/kubermatic-master-*.yaml
    - /etc/prometheus/rules/managed-*.yaml
    - /etc/prometheus/rules/usercluster-mla-*.yaml

loki:
  singleBinary:
    persistence:
      size: 1Gi
