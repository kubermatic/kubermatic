# Helm values for the usercluster-mla stack in the MLA upgrade e2e job. Single
# replicas as in setup-kubermatic-mla-in-kind.sh, and a querier that reads
# everything older than one minute from object storage, so the post-upgrade
# checks prove that the data in MinIO survived instead of reading the
# ingesters' memory.

cortex:
  config:
    ingester:
      lifecycler:
        ring:
          replication_factor: 1
    querier:
      query_ingesters_within: 1m
      query_store_after: 0s
  ingester:
    replicas: 1
  distributor:
    replicas: 1
  alertmanager:
    replicas: 1
  nginx:
    replicas: 1

loki-distributed:
  loki:
    structuredConfig:
      ingester:
        lifecycler:
          ring:
            replication_factor: 1
  ingester:
    replicas: 1
  distributor:
    replicas: 1
