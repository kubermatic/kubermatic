groups:
  - name: sample
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total{job="api"}[5m]))
      - alert: HighErrorRate
        expr: |
          job:http_requests:rate5m > 10
          and on (job) up{job="api"} == 1
        annotations:
          message: "{{ $labels.job }} is failing"
