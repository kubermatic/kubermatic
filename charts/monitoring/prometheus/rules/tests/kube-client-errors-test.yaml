rule_files:
  - ../general-kube-kubelet.yaml

evaluation_interval: 1m

tests:
  # client-go counts watch streams that the API server closes at its timeout as
  # code="<error>"; on low-traffic clients these reconnects alone exceed 1% of all
  # requests and must not raise an alert
  - interval: 30s
    input_series:
      - series: 'rest_client_requests_total{job="pods",namespace="kubermatic",pod="kubermatic-api-abc",code="200"}'
        values: '0+100x80'
      - series: 'rest_client_requests_total{job="pods",namespace="kubermatic",pod="kubermatic-api-abc",code="<error>"}'
        values: '0+3x80'
      - series: 'rest_client_requests_total{job="kubelet",instance="node1",code="200"}'
        values: '0+100x80'
      - series: 'rest_client_requests_total{job="kubelet",instance="node1",code="<error>"}'
        values: '0+3x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeClientErrors
        exp_alerts: []
      - eval_time: 30m
        alertname: KubeletClientErrors
        exp_alerts: []

  # real 5xx responses above 1% still raise the alerts
  - interval: 30s
    input_series:
      - series: 'rest_client_requests_total{job="pods",namespace="kubermatic",pod="kubermatic-api-abc",code="200"}'
        values: '0+100x80'
      - series: 'rest_client_requests_total{job="pods",namespace="kubermatic",pod="kubermatic-api-abc",code="503"}'
        values: '0+3x80'
      - series: 'rest_client_requests_total{job="kubelet",instance="node1",code="200"}'
        values: '0+100x80'
      - series: 'rest_client_requests_total{job="kubelet",instance="node1",code="500"}'
        values: '0+3x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeClientErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kubelet
              namespace: kubermatic
              pod: kubermatic-api-abc
            exp_annotations:
              message: The pod kubermatic/kubermatic-api-abc is experiencing 3% errors.
              runbook_url: https://docs.kubermatic.com/kubermatic/latest/cheat-sheets/alerting-runbook/#alert-kubeclienterrors
      - eval_time: 30m
        alertname: KubeletClientErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              resource: node1
              service: kubelet
              instance: node1
            exp_annotations:
              message: The kubelet on node1 is experiencing 3% errors.
              runbook_url: https://docs.kubermatic.com/kubermatic/latest/cheat-sheets/alerting-runbook/#alert-kubeletclienterrors
