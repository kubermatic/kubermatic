rule_files:
  - ../general-kube-kubelet.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # kubelet exposes kubelet_running_pods; the old kubelet_running_pod_count
      # name is gone from all supported Kubernetes versions
      - series: 'kubelet_running_pods{job="kubelet",instance="node1"}'
        values: '105+0x30'
      - series: 'kubelet_running_pods{job="kubelet",instance="node2"}'
        values: '20+0x30'

    alert_rule_test:
      - alertname: KubeletTooManyPods
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              resource: node1
              service: kubelet
              job: kubelet
              instance: node1
            exp_annotations:
              message: Kubelet node1 is running 105 pods, close to the limit of 110.
              runbook_url: https://docs.kubermatic.com/kubermatic/latest/cheat-sheets/alerting-runbook/#alert-kubelettoomanypods
