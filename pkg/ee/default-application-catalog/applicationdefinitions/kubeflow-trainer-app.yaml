apiVersion: apps.kubermatic.k8c.io/v1
kind: ApplicationDefinition
metadata:
  name: kubeflow-trainer
spec:
  description: Kubernetes-native operator for distributed training and fine-tuning of AI models with PyTorch, JAX, DeepSpeed and more
  displayName: Kubeflow Trainer
  method: helm
  versions:
    - template:
        source:
          helm:
            chartName: kubeflow-trainer
            chartVersion: 2.3.0
            url: oci://ghcr.io/kubeflow/charts
      version: v2.3.0
  defaultNamespace:
    name: kubeflow-system
    create: true
  defaultValuesBlock: |
    nameOverride: "kubeflow-trainer"
    fullnameOverride: "kubeflow-trainer"
    # install the default ClusterTrainingRuntimes such as torch-distributed
    runtimes:
      defaultEnabled: true
    # set to false if JobSet is already installed in the cluster
    jobset:
      install: true
  documentationURL: https://www.kubeflow.org/docs/components/trainer/
  sourceURL: https://github.com/kubeflow/trainer
  logo: |-
    
  logoFormat: svg+xml
