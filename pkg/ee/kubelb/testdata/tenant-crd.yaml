# Structural subset of the KubeLB v1.5 Tenant schema, including its defaulting
# and field ownership semantics. Only the fields exercised by these tests are included.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.kubelb.k8c.io
spec:
  group: kubelb.k8c.io
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                allowedDomains:
                  type: array
                  default: ["**"]
                  items:
                    type: string
                defaultAnnotations:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                gatewayAPI:
                  type: object
                  properties:
                    class:
                      type: string
                    classMappings:
                      type: array
                      maxItems: 32
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [source]
                      items:
                        type: object
                        required: [source, target]
                        properties:
                          source:
                            type: string
                            minLength: 1
                            maxLength: 253
                          target:
                            type: string
                            minLength: 1
                            maxLength: 253
                loadBalancer:
                  type: object
                  properties:
                    limit:
                      type: integer
                timeouts:
                  type: object
                  properties:
                    connect:
                      type: string
                    request:
                      type: string
                    idleConnection:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
