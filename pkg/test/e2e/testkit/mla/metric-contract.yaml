# Metric names used by the seed Prometheus rules and the seed and user cluster
# MLA Grafana dashboards, generated by hack/tools/promql-metrics.
#
# seed:        must exist in the seed Prometheus (checked live by the seed MLA
#              suite on a seed with at least one MLA user cluster).
# userCluster: must exist in Cortex for an MLA user cluster tenant (checked
#              live by the user cluster MLA suite).
# notInCI:     referenced, but not produced in the reference environment.
#              Entries starting with STALE are confirmed bugs in the rules or
#              scrape config, not environment gaps.
#
# First generated 2026-10-18 from ks environment burak-mla (KKP v2.31.2, one
# user cluster with one worker). hack/verify-mla-metric-contract.sh fails
# when a rule or dashboard references a name that is in none of the lists.

