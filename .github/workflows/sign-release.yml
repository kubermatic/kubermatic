name: Sign Release
on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
jobs:
  sign-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download ${{ github.event.release.tag_name }} -D assets -R ${{ github.repository }}

      - name: Compute checksums over all downloaded assets
        working-directory: assets
        run: sha256sum * > checksums.txt

      - name: Sign checksums (keyless)
        working-directory: assets
        run: cosign sign-blob --bundle=checksums.txt.sigstore.json checksums.txt --yes

      - name: Upload checksums + signature to the release
        working-directory: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            checksums.txt checksums.txt.sigstore.json \
            -R ${{ github.repository }} --clobber

